[project]
name = "powerbi-mcp"
version = "0.2.0"
description = "REST-only, read-only Power BI MCP Server with FastMCP"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastmcp>=0.11.0",
    "msal>=1.24.0",
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0.0",
    "requests>=2.31.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.15.0",
]

[dependency-groups]
dev = [
    "black>=26.5.1",
    "isort>=8.0.1",
    "pylint>=4.0.7",
    "taskipy>=1.14.1",
]
